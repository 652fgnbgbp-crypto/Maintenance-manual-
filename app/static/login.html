<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vantage · Sign in</title>
<meta name="theme-color" content="#162943">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vantage">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="icon" href="/static/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/static/theme.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100dvh; }
  body { font: 16px/1.5 var(--font-sans); background: var(--brand); color: var(--text); display: grid; place-items: center;
    padding: calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom)); -webkit-font-smoothing: antialiased; }
  .box { width: 100%; max-width: 420px; }
  .brand { color: var(--brand-ink); text-align: center; margin-bottom: 30px; }
  .brand > svg { width: 72px; height: 72px; }
  .brand h1 { font: 800 40px/1.05 var(--font-display); margin: 14px 0 6px; letter-spacing: -.025em; }
  .brand .by { font-size: 11px; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; color: var(--brand-muted); }
  .brand p { margin: 14px 0 0; color: var(--brand-muted); font-size: 17px; }
  form { background: var(--surface); border-radius: 18px; padding: 26px; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
  label { display: block; font-weight: 600; font-size: 14px; margin: 12px 0 6px; }
  input { width: 100%; min-height: 52px; padding: 12px 14px; font: inherit; font-size: 17px; color: inherit; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-2); }
  input:focus { outline: 3px solid color-mix(in srgb, var(--gold) 40%, transparent); border-color: var(--gold); }
  button { width: 100%; min-height: 54px; margin-top: 22px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font: inherit; font-size: 17px; font-weight: 650; cursor: pointer; }
  button:disabled { opacity: .6; }
  .err { color: var(--danger); font-size: 15px; min-height: 22px; margin-top: 12px; }
  .foot { color: var(--brand-ink); display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 34px; }
  .foot svg { width: 40px; height: 40px; }
  .tw-name { font: 800 17px/1 var(--font-display); letter-spacing: .12em; text-align: left; }
  .tw-rule { width: 34px; height: 2px; background: var(--gold); margin: 5px 0; }
  .tw-sub { font-size: 9px; letter-spacing: .32em; color: var(--brand-muted); }
</style>
</head>
<body>
<div class="box">
  <div class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="9" style="fill:var(--brand-2)"/><path style="fill:var(--gold)" d="M20 5.5l3.4 4.6h-6.8z"/><path fill="#fff" d="M8.5 12.5h7.2L20 26.3l4.3-13.8h7.2L23.6 34h-7.2z"/></svg>
    <h1>Vantage</h1>
    <div class="by">By Torwood Aerospace Group</div>
    <p>AI-assisted maintenance manuals</p>
  </div>
  <form id="f">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" autocapitalize="none" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button id="go">Sign in</button>
    <div class="err" id="err"></div>
  </form>
  <div class="foot">
    <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17.6" fill="none" stroke="currentColor" stroke-width="2.6"/><path style="fill:var(--gold)" d="M20 6.6l3.2 4.2h-6.4z"/><path fill="currentColor" d="M8.6 12.6h22.8l-1 3.2H9.6zM17.9 15.8h4.2v12.6h3.4v3.2h-11v-3.2h3.4z"/></svg>
    <div><div class="tw-name">TORWOOD</div><div class="tw-rule"></div><div class="tw-sub">AEROSPACE GROUP</div></div>
  </div>
</div>
<script>
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; err.textContent = "";
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: document.getElementById("email").value, password: document.getElementById("password").value }) });
    if (r.ok) { location.href = "/"; return; }
    err.textContent = (await r.json()).detail || "Sign-in failed.";
  } catch { err.textContent = "Can't reach Vantage. Check your connection."; }
  btn.disabled = false;
});
</script>
</body>
</html>
